name: Training data and evaluation contracts
on:
  push:
    paths: ["training_lab/**", "repo_lab/**", "one_gpu_lm/**", "tests/**", "scripts/setup_27b.sh", "environments/**", "configs/**", "experiments/013-training-infrastructure/**", "experiments/014-coding-quality/**", "experiments/015-agent-interface/**", "experiments/016-tool-roundtrip/**", "experiments/017-edit-progress/**", "experiments/018-repair-verification/**", "experiments/019-coding-release/**", "experiments/020-repair-curriculum/**", "experiments/021-observed-recovery/**", "experiments/022-action-repair/**", "experiments/023-evaluation-stability/**", "experiments/024-feedback-noise/**", "experiments/025-verified-distillation/**", "experiments/026-action-allocation/**", "experiments/027-correction-sampling/**", "experiments/028-failed-state-recovery/**", "experiments/029-repair-decisions/**", "experiments/030-teacher-reasoning/**", "experiments/031-correction-mix/**", "experiments/032-multifile-completion/**", "experiments/033-first-edit-probe/**", "experiments/035-edit-bottleneck/**", "experiments/036-regression-evidence/**", "experiments/037-compact-regression/**", "experiments/038-independent-compact/**", "experiments/039-release-development/**", "experiments/040-editable-source-context/**", "experiments/041-first-edit-continuation/**", "experiments/042-first-edit-sft/**", ".github/workflows/training-contracts.yml"]
  pull_request:
    paths: ["training_lab/**", "repo_lab/**", "one_gpu_lm/**", "tests/**", "scripts/setup_27b.sh", "environments/**", "configs/**", "experiments/013-training-infrastructure/**", "experiments/014-coding-quality/**", "experiments/015-agent-interface/**", "experiments/016-tool-roundtrip/**", "experiments/017-edit-progress/**", "experiments/018-repair-verification/**", "experiments/019-coding-release/**", "experiments/020-repair-curriculum/**", "experiments/021-observed-recovery/**", "experiments/022-action-repair/**", "experiments/023-evaluation-stability/**", "experiments/024-feedback-noise/**", "experiments/025-verified-distillation/**", "experiments/026-action-allocation/**", "experiments/027-correction-sampling/**", "experiments/028-failed-state-recovery/**", "experiments/029-repair-decisions/**", "experiments/030-teacher-reasoning/**", "experiments/031-correction-mix/**", "experiments/032-multifile-completion/**", "experiments/033-first-edit-probe/**", "experiments/035-edit-bottleneck/**", "experiments/036-regression-evidence/**", "experiments/037-compact-regression/**", "experiments/038-independent-compact/**", "experiments/039-release-development/**", "experiments/040-editable-source-context/**", "experiments/041-first-edit-continuation/**", "experiments/042-first-edit-sft/**", ".github/workflows/training-contracts.yml"]
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest training_lab.test_contracts repo_lab.test_contracts tests.test_modules tests.test_training_infrastructure tests.test_balanced_data tests.test_quality_screen tests.test_agent_interface tests.test_interface_report tests.test_tool_history tests.test_roundtrip_report tests.test_edit_progress tests.test_progress_report tests.test_repair_verification tests.test_repair_reference_screen tests.test_task_stubs tests.test_repair_report tests.test_training_encoding tests.test_reference_episodes tests.test_release_decision tests.test_release_preparation tests.test_release_report tests.test_curriculum_diagnosis tests.test_repair_curriculum tests.test_curriculum_preparation tests.test_curriculum_report tests.test_observed_recovery tests.test_observed_hardware tests.test_observed_report tests.test_action_repair tests.test_action_report tests.test_evaluation_stability tests.test_stability_report tests.test_feedback_noise tests.test_feedback_report tests.test_verified_tasks tests.test_verified_rollout tests.test_verified_audit tests.test_verified_submission tests.test_verified_comparison tests.test_verified_export tests.test_verified_capacity tests.test_verified_collection tests.test_verified_candidate_data tests.test_verified_evaluation tests.test_verified_factorial tests.test_verified_evaluation_control tests.test_verified_evaluation_audit tests.test_verified_evaluation_cycle tests.test_verified_runtime_identity tests.test_verified_cycle_report tests.test_verified_collection_report tests.test_behavior_diagnosis tests.test_recovery_state tests.test_recovery_rollout tests.test_correction_collection tests.test_failure_states tests.test_failure_continuation tests.test_repair_decisions tests.test_teacher_reasoning tests.test_mixed_data tests.test_mixed_training_audit tests.test_mixed_eval_design tests.test_mixed_eval_cycle tests.test_mixed_report
      - run: python -m unittest tests.test_historic_tasks tests.test_multifile_diagnosis tests.test_historic_selection tests.test_historic_plan tests.test_historic_policy tests.test_historic_expert tests.test_historic_analysis tests.test_historic_scope tests.test_historic_outcomes tests.test_historic_report
      - run: python -m unittest tests.test_request_journal tests.test_historic_incident_report tests.test_resilient_eval_audit tests.test_first_edit_probe tests.test_first_action_loss tests.test_first_action_design tests.test_modelscope_promotion tests.test_modelscope_publish tests.test_modelscope_readback tests.test_reload_probe
      - run: python -m unittest tests.test_editable_source_context tests.test_first_edit_continuation tests.test_first_edit_report tests.test_continuation_training
      - run: python -m compileall -q training_lab repo_lab one_gpu_lm tests
      - run: bash -n scripts/setup_27b.sh
      - run: python -m py_compile experiments/013-training-infrastructure/report.py experiments/014-coding-quality/report.py experiments/014-coding-quality/run.py experiments/014-coding-quality/audit.py experiments/015-agent-interface/run.py experiments/015-agent-interface/report.py experiments/015-agent-interface/audit.py experiments/016-tool-roundtrip/run.py experiments/016-tool-roundtrip/probe.py experiments/016-tool-roundtrip/report.py experiments/016-tool-roundtrip/audit.py experiments/017-edit-progress/run.py experiments/017-edit-progress/probe.py experiments/017-edit-progress/audit.py experiments/017-edit-progress/report.py experiments/017-edit-progress/dependency_review.py experiments/017-edit-progress/supplement/reference_screen.py experiments/017-edit-progress/supplement/report.py experiments/018-repair-verification/run.py experiments/018-repair-verification/probe.py experiments/018-repair-verification/reference_screen.py experiments/018-repair-verification/audit.py experiments/018-repair-verification/report.py experiments/019-coding-release/run.py experiments/019-coding-release/decision.py experiments/019-coding-release/preparation.py experiments/019-coding-release/audit.py experiments/019-coding-release/freeze.py experiments/019-coding-release/audit_inputs.py experiments/019-coding-release/postrun_integrity.py experiments/019-coding-release/report.py experiments/020-repair-curriculum/*.py experiments/021-observed-recovery/*.py experiments/022-action-repair/*.py experiments/023-evaluation-stability/*.py experiments/024-feedback-noise/*.py experiments/025-verified-distillation/*.py
      - run: python -m py_compile experiments/034-first-action-ablation/*.py experiments/035-edit-bottleneck/*.py experiments/036-regression-evidence/*.py experiments/037-compact-regression/*.py experiments/038-independent-compact/*.py experiments/039-release-development/*.py
      - run: python -m py_compile experiments/040-editable-source-context/*.py experiments/041-first-edit-continuation/*.py
