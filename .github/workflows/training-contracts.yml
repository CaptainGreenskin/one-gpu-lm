name: Training data and evaluation contracts
on:
  push:
    paths: ["training_lab/**", "repo_lab/**", "one_gpu_lm/**", "tests/**", "scripts/setup_27b.sh", "environments/**", "configs/**", "experiments/013-training-infrastructure/**", "experiments/014-coding-quality/**", "experiments/015-agent-interface/**", "experiments/016-tool-roundtrip/**", "experiments/017-edit-progress/**", "experiments/018-repair-verification/**", "experiments/019-coding-release/**", ".github/workflows/training-contracts.yml"]
  pull_request:
    paths: ["training_lab/**", "repo_lab/**", "one_gpu_lm/**", "tests/**", "scripts/setup_27b.sh", "environments/**", "configs/**", "experiments/013-training-infrastructure/**", "experiments/014-coding-quality/**", "experiments/015-agent-interface/**", "experiments/016-tool-roundtrip/**", "experiments/017-edit-progress/**", "experiments/018-repair-verification/**", "experiments/019-coding-release/**", ".github/workflows/training-contracts.yml"]
permissions:
  contents: read
jobs:
  cpu-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest training_lab.test_contracts repo_lab.test_contracts tests.test_modules tests.test_training_infrastructure tests.test_balanced_data tests.test_quality_screen tests.test_agent_interface tests.test_interface_report tests.test_tool_history tests.test_roundtrip_report tests.test_edit_progress tests.test_progress_report tests.test_repair_verification tests.test_repair_reference_screen tests.test_task_stubs tests.test_repair_report tests.test_training_encoding
      - run: python -m compileall -q training_lab repo_lab one_gpu_lm tests
      - run: bash -n scripts/setup_27b.sh
      - run: python -m py_compile experiments/013-training-infrastructure/report.py experiments/014-coding-quality/report.py experiments/014-coding-quality/run.py experiments/014-coding-quality/audit.py experiments/015-agent-interface/run.py experiments/015-agent-interface/report.py experiments/015-agent-interface/audit.py experiments/016-tool-roundtrip/run.py experiments/016-tool-roundtrip/probe.py experiments/016-tool-roundtrip/report.py experiments/016-tool-roundtrip/audit.py experiments/017-edit-progress/run.py experiments/017-edit-progress/probe.py experiments/017-edit-progress/audit.py experiments/017-edit-progress/report.py experiments/017-edit-progress/dependency_review.py experiments/017-edit-progress/supplement/reference_screen.py experiments/017-edit-progress/supplement/report.py experiments/018-repair-verification/run.py experiments/018-repair-verification/probe.py experiments/018-repair-verification/reference_screen.py experiments/018-repair-verification/audit.py experiments/018-repair-verification/report.py
